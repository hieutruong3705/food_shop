# Combine with dev for local accounts/email; this profile overrides H2.
spring.config.import=file:./data/mysql-local.properties,optional:file:./data/chat-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/techshop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:techshop_local}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
