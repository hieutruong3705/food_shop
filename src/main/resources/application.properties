# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techshop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:techshop}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


# ===============================
# SERVER
# ===============================

server.port=${PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

shop.upload-dir=${UPLOAD_DIR:./data/uploads}


# ===============================
# FRONTEND
# ===============================

shop.client-url=${CLIENT_URL:http://localhost:5173}


# ===============================
# MAIL
# ===============================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}

shop.mail-from=${MAIL_FROM:no-reply@techshop.example}

# Profile dev ghi email ra data/dev-mail thay vì gửi SMTP; đặt false để gửi thật.
shop.dev-mail-enabled=${MAIL_DEV:true}


# ===============================
# ERROR HANDLING
# ===============================

server.error.include-message=never
server.error.include-stacktrace=never


# ===============================
# H2
# ===============================

spring.h2.console.enabled=false


# ===============================
# VNPAY
# ===============================

# Keep the local file out of Git and the frontend bundle: it holds the merchant hash secret.
spring.config.import=optional:file:./data/mysql-local.properties,optional:file:./data/chat-local.properties,optional:file:./data/vnpay-local.properties,optional:file:./data/mail-local.properties,optional:file:./data/oauth-local.properties
shop.vnpay.enabled=${VNPAY_ENABLED:false}
shop.vnpay.tmn-code=${VNPAY_TMN_CODE:}
shop.vnpay.secret=${VNPAY_HASH_SECRET:}
shop.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
shop.vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# Blank falls back to shop.client-url + /payment-return, which fits both Vite 5173 and the packaged JAR.
shop.vnpay.return-url=${VNPAY_RETURN_URL:}


# ===============================
# FLYWAY
# ===============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${DB_BASELINE:false}
spring.flyway.baseline-version=1


# ===============================
# RATE LIMITS (per client address; see docs/API.md before running behind a proxy)
# ===============================

shop.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}


# ===============================
# LOGGING
# ===============================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.boot=INFO


# ===============================
# DEVTOOLS
# ===============================

spring.devtools.restart.enabled=false

# Server-side AI chat configuration (OpenAI-compatible, Groq by default).
# The local file is imported in the VNPAY section above.
shop.chat.api-key=${CHAT_API_KEY:}
shop.chat.base-url=${CHAT_BASE_URL:https://api.groq.com/openai/v1}
shop.chat.model=${CHAT_MODEL:openai/gpt-oss-20b}
shop.chat.enabled=${CHAT_ENABLED:true}
