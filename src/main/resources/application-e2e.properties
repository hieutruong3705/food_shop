# Isolated browser-test database. Never import mysql-local in this profile.
spring.datasource.url=jdbc:h2:file:./data/techshop-e2e;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
shop.demo.enabled=true
shop.chat.enabled=false
# The browser suite logs in far more often than a person would from one address.
shop.rate-limit.enabled=false
# The browser suite creates offers and reads the home page straight away.
shop.home-cache-seconds=0
shop.chat.api-key=
shop.vnpay.enabled=false
# Unroutable on purpose: the browser suite must never reach the real VNPay gateway.
shop.vnpay.query-url=http://127.0.0.1:1/vnpay-test-only
shop.upload-dir=./data/e2e-uploads
shop.dev-mail-dir=./data/e2e-mail
shop.client-url=http://127.0.0.1:18080
server.address=127.0.0.1
server.port=18080
server.servlet.session.cookie.secure=false
