spring.datasource.url=jdbc:h2:mem:techshop-test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
shop.demo.enabled=false
shop.upload-dir=./target/test-uploads

spring.flyway.enabled=false
shop.chat.enabled=false
shop.rate-limit.enabled=false
shop.home-cache-seconds=0
shop.vnpay.enabled=false
# Unroutable on purpose: no test may reach the real VNPay gateway.
shop.vnpay.query-url=http://127.0.0.1:1/vnpay-test-only
